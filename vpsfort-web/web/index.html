<!-- shown when JavaScript is off or blocked (NoScript, uBlock's rules, a locked-down browser):
     the page is built by app.js, and the login needs it for the proof of work -->
<noscript>
<div class="login-wrap">
  <div class="card login nojs" role="alert">
    <div class="brand"><img src="/icon.svg" alt="">vpsfort console</div>
    <p>This console needs JavaScript, and it is off or blocked for this site.</p>
    <p class="why">The page is built in the browser and the login does a proof of work (a hash search) before it sends the password. Nothing is loaded from any other site; the only scripts are the console's own (<code>/app.js</code>, <code>/work.js</code>).</p>
    <p class="how">Allow JavaScript for this site in the browser, or in NoScript, uBlock Origin or the extension that blocks it, then reload.</p>
  </div>
</div>
</noscript>
