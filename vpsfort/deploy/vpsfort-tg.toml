# vpsfort for the Telegram relay node: a small VPS with SSH + UFW, no ejabberd, running vpsfort-tg-bot.
# It delivers the cluster's admin messages (its own, and those the XMPP and VPN nodes relay)
# to Telegram through vpsfort-tg-bot, so the XMPP server never talks to Telegram itself. The other
# nodes limit what it may hand them ([cluster] peer_accept there): notices and the weekly
# report's input, never bans or trust. Add this node to their peers and peer_accept (their
# templates have the lines, commented out) and its address to ufw there (install.sh does).
# `vpsfort -c /etc/vpsfort/vpsfort.toml print-config` shows every effective setting.
mode = "shadow"
# "apt": dpkg and apt (Debian, Ubuntu); "dnf": rpm and dnf (Fedora, RHEL; the -dnf templates)
package_manager = "apt"
state_file = "/var/lib/vpsfort/state.json"
socket = "/run/vpsfort/vpsfort.sock"
actions_log = "/var/log/vpsfort/actions.jsonl"

[sources]
ejabberd = false
ssh = true
ufw = true
oom = true                # alert when the kernel kills a process for lack of memory ("system" topic)
privilege = true          # su and sudo: failures (someone has an account and tries for root) as alerts
pam = true                # PAM and account tools: console/polkit login failures, lockouts, passwords, new accounts and admins
audit = true              # the audit log: the same as the kernel records them, auditd stopped or switched off
audit_keys = []           # audit rule keys (auditctl -k) to alert on when their rules fire, e.g. ["identity"]; "*" for any
# audit_log = "/var/log/audit/audit.log"   # auditd's file instead of the journal (journald with Audit=no)
services = ["vpsfort-tg-bot.service"]   # a failed vpsfort-tg-bot becomes a system alert, relayed to the XMPP admin
# Built-in sources for common services (README, "Built-in sources for common services"):
# apache, nginx, haproxy, prosody, nextcloud (without AIO), owncloud (10), mysql (MariaDB too),
# postgresql, mongodb, redis (Valkey too), postfix, dovecot, vpsfort-web (the web console), decoy (a catch-all web site nothing points at: one request bans). Their logs are looked for in the usual places; [sources.app_logs] names others.
apps = []

[ports]
# Nothing is served here: vpsfort-tg-bot only connects out (HTTPS to api.telegram.org).
whitelist = []
# One UFW-blocked connection attempt to any of these = immediate ban (TCP only: UDP is spoofable).
tripwire = [
    "21/tcp", "23/tcp", "2323/tcp",                      # FTP, Telnet
    "25/tcp", "465/tcp", "587/tcp",                      # SMTP, SMTPS, submission (no MX points here)
    "110/tcp", "995/tcp", "143/tcp", "993/tcp",          # POP3(S), IMAP(S)
    "135/tcp", "139/tcp", "445/tcp", "3389/tcp", "5985/tcp", "5986/tcp", # Windows RPC, NetBIOS, SMB, RDP, WinRM
    "5900/tcp", "5901/tcp", "1723/tcp", "7547/tcp", "8291/tcp", # VNC, PPTP, TR-069, MikroTik Winbox
    "389/tcp", "2375/tcp", "2376/tcp",                   # LDAP, Docker API
    "1433/tcp", "1521/tcp", "3306/tcp", "5432/tcp", "27017/tcp", # MS SQL, Oracle, MySQL, PostgreSQL, MongoDB
    "6379/tcp", "9200/tcp", "11211/tcp",                 # Redis, Elasticsearch, Memcached
]
# Names in the dashboard's port histogram (the cluster port is named from [cluster]).
names = {}
# Tripwire hits from vpsfort's own nftables table (enforce mode, nftables): the first new TCP
# connection per source every 10 minutes to a tripwire port nothing listens on is logged, at up
# to this rate for the whole host. UFW's log keeps only about 3 lines a minute for everything.
kernel_tripwires = true
kernel_tripwire_rate = "60/minute"
# Ports vpsfort listens on itself, never answering: a completed TCP handshake can't come
# from a forged address, so a hit bans for certain (tripwire_connect). With any set, a blocked
# SYN to a tripwire port scores 50 instead of 100 unless [scoring.weights] says otherwise.
# Open them in the firewall (ufw allow 2323/tcp) and take them out of `tripwire`.
honeypot = []
# honeypot = ["2323/tcp", "5900/tcp"]
# Bytes read from each honeypot connection (up to 3 seconds) before it is closed: what the
# scanner was after (a Telnet login, an HTTP request), in the evidence and the abuse report.
# 0 closes at once without reading; at most 4096.
honeypot_capture = 512
# Honeypot ports that show a server's fixed prompts (login:, 220, +OK) and keep the replies,
# for dedicated honeypot nodes (README, "Dedicated honeypot nodes"): telnet, ftp, smtp, pop3, imap, ssh (the banner alone).
# honeypot_prompts = { "2323/tcp" = "telnet", "21/tcp" = "ftp", "22/tcp" = "ssh", "25/tcp" = "smtp" }
# The greeting each prompted protocol opens with, a real server's line (OpenSSH, vsftpd, Postfix,
# Dovecot) unless set here: the software and version the port is to pass for. Set ssh to what
# the sshd on this host's real port sends (nc -w 2 host port).
# honeypot_banners = { ssh = "SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u5", ftp = "220 (vsFTPd 3.0.3)" }

[canary]
# SSH names attackers try first: one attempt = immediate ban. Remove the name YOU log in with
# (or, if sshd admits a single key-only user, use ssh = ["*"] with that user in `except`).
ssh = ["admin", "test", "user", "oracle", "postgres", "git", "pi", "ftpuser", "guest",
       "support", "deploy", "docker", "mysql", "ubnt", "debian", "centos"]
except = []

[silence]                 # warn when UFW or sshd logging goes quiet ("0s" = never)
ufw = "2h"
ssh = "2d"
# [silence.apps]           # logs of [sources] apps to warn about when quiet, e.g. nginx_access = "2h"

# Kernel rate limits on new connections per source address (enforce mode, nftables only).
[[ratelimit]]
ports = ["22/tcp"]        # SSH (this host's sshd port): same idea as ufw's LIMIT (6 per 30 s), but before UFW
rate = "6/minute"
burst = 6

[allowlist]
nets = [
  "127.0.0.0/8",
  "::1",
  # "198.51.100.21",   # your own addresses (home, office): an example, put yours
  # Upstream DNS (UDP sources can be spoofed: a forged flood "from" a resolver must never ban it).
  "8.8.8.8", "8.8.4.4", "1.1.1.1", "1.0.0.1",
]
# Host names whose addresses are allowlisted too (a home connection with a dynamic DNS name),
# resolved every 10 minutes. Whoever controls the name's DNS controls this entry.
hosts = []
trust_authenticated = true   # per service, not shared (see vpsfort.toml)
trust_ttl = "24h"

[bans]
ladder = ["1h", "6h", "1d", "7d", "30d"]
forgive_after = "30d"

[enforce]
backend = "auto"          # nftables (prerouting, so Docker-published ports are covered), falling back to firewalld, ufw, then iptables

[notify]
# No ejabberd here: admin messages (this node's, and the ones the other nodes relay) go only
# to the Telegram bot's outbox; vpsfort-tg-bot sends them with XMPP account names replaced.
enabled = true
xmpp = false
tg_outbox = "/opt/vpsfort-tg-bot/outbox"
tg_user = "vpsfort-tg-bot"
# The mail bot can relay here too (or instead: drop tg_outbox): vpsfort-mail-bot's README.
#mail_outbox = "/opt/vpsfort-mail-bot/outbox"
#mail_user = "vpsfort-mail-bot"
# So can the Signal and Matrix bots: vpsfort-signal-bot's and vpsfort-matrix-bot's READMEs.
#signal_outbox = "/opt/vpsfort-signal-bot/outbox"
#signal_user = "vpsfort-signal-bot"
#matrix_outbox = "/opt/vpsfort-matrix-bot/outbox"
#matrix_user = "vpsfort-matrix-bot"
# And the push bot (ntfy, Gotify or a webhook; vpsfort-push-bot's README).
#push_outbox = "/opt/vpsfort-push-bot/outbox"
#push_user = "vpsfort-push-bot"
# So can vpsfort-xmpp-bot in client mode (BOT_MODE=client, an account on any XMPP server; its README).
#xmpp_outbox = "/opt/vpsfort-xmpp-bot/outbox"
#xmpp_user = "vpsfort-xmpp-bot"
bot_stuck_after = "1h"            # then a system alert, relayed to the XMPP admin

[cluster]
# Share bans, suspicion reports and trusted addresses with other vpsfort nodes over an
# encrypted, authenticated TCP link (no VPN needed). All nodes use the same key; deploy.sh
# generates deploy/cluster.key once and installs it as /etc/vpsfort/cluster.key.
# Off in this template: turn it on once node_id and peers are your cluster's. The peers here
# are examples in a documentation range; the installers open no firewall rule for those.
enabled = false
node_id = "tg"
listen = "0.0.0.0:7946"            # install.sh opens it in ufw for the peers below only
peers = ["203.0.113.12:7946", "203.0.113.11:7946"]   # xmpp, vpn; peers are never banned here
key_file = "/etc/vpsfort/cluster.key"
rotate_after = "180d"             # then a weekly reminder to run deploy/rotate-cluster-key.sh
sync_interval = "10s"
full_sync_every = "10m"
# Its own alerts and digest go to the XMPP admin too (relay_notices below). It takes the
# others' bans for its own firewall, but passes none on (share covers forwarded facts too):
# the others accept only notices and files from it anyway (their peer_accept).
share = ["notices", "log_digests", "probes", "mirror"]
accept = ["bans", "unbans", "reports", "trust", "notices", "log_digests", "probes", "mirror"]
relay_notices = true
# Optional: node identities. Each node signs what it shares with a key of its own, so a node
# broken into (or a stolen cluster key) can speak only for itself, and deleting a node's line
# in `nodes` drops it without a new cluster key. `vpsfort cluster-identity --out
# /etc/vpsfort/node.key` on each node prints its line for `nodes`. Same `nodes` on every node;
# require_signatures once every node signs (README, "Node identities").
#identity_file = "/etc/vpsfort/node.key"
#nodes = { xmpp = "<public key>", vpn = "<public key>", tg = "<public key>" }
#require_signatures = true
# Bans learned from peers last at most this long here. The built-in default (1d) limits what a
# compromised or mistaken node can do to the others; both nodes here are equally trusted, so
# mirror the origin's full ban ladder (a peer's 7d ban is 7d here too).
max_remote_ban = "30d"
report_factor = 0.5                # peer-reported points count half
min_report_points = 10
max_hops = 3
max_clock_skew = "5m"              # nodes need roughly correct clocks (systemd-timesyncd)
# Every message's key comes from a fresh exchange ("prefer": a peer on an older version, which
# doesn't answer it, gets the plain frame instead; "require": refuse that both ways once every
# node is current; "off").
forward_secrecy = "prefer"
# A notice relayed to the peers (an alert or digest another node delivers for this one) is
# kept this long for a peer that can't be reached, so a relay node down for the night still
# gets it when it is back (delivered late, it says so). 2 MB of notices at most.
notice_ttl = "24h"
# A copy of this node's actions log on one direct peer (its node_id): every line goes there at
# the next sync, so what a wiped node decided is still somewhere ("mirror" in share and in the
# peer's accept). The peer writes it to its mirror_dir as <node>.jsonl, rotated once at
# mirror_max_mb; `vpsfort mirror` there lists them.
mirror_to = ""
mirror_dir = "/var/lib/vpsfort/mirror"
mirror_max_mb = 64
# Files peers send once (`vpsfort cluster-send-report`): here the weekly abuse report the
# XMPP server merged, which the abuse-report timer (role relay) hands to vpsfort-tg-bot. "" refuses them.
inbox = "/var/lib/vpsfort/inbox"

[exposure]
enabled = true
interval = "60s"
ufw = "/usr/sbin/ufw"
ignore = []
startup_grace = "15m"     # weekly reboot: wg-easy starts after vpsfort
new_after_scans = 2
gone_after_scans = 5
# Hourly, the cluster's direct peers try this host's public TCP ports from outside: a port the
# firewall should block that a peer reaches is a high alert, one open here that no peer reaches
# (a firewall in front of the host) an info. Needs "probes" in [cluster] share and accept.
peer_probe = false

[feeds]
# Public blocklists in their own nftables sets (feed4/feed6), refreshed daily.
# `vpsfort feeds clear` empties them in one step; enabled = false removes them on restart.
enabled = true
urls = [
  "https://www.spamhaus.org/drop/drop.txt",                 # Spamhaus DROP (includes former EDROP)
  "https://www.spamhaus.org/drop/dropv6.txt",
  "https://iplists.firehol.org/files/firehol_level1.netset",  # FireHOL level1 (private ranges are filtered out)
]
refresh = "24h"
cache_dir = "/var/lib/vpsfort/feeds"
fetch = ["curl", "-fsSL", "--proto-redir", "=https", "--max-time", "60", "--retry", "2", "--max-filesize", "50000000"]   # falls back to wget
max_entries = 100000
min_prefix_v4 = 12        # one bad entry must not drop a whole /8
min_prefix_v6 = 24
max_growth = 2.0          # refuse a refresh covering >2x the last accepted list (keeps that one)
# Networks (ASNs) to block wholesale, their address blocks taken from the [geo] network
# database (needs [geo] with asn_url): Spamhaus ASN-DROP lists hijacked and criminal networks.
asn_urls = ["https://www.spamhaus.org/drop/asndrop.json"]

[console]
# The read-only socket for vpsfort-web, the web console (vpsfort-web/README.md): its group
# reads this node's snapshot, digest preview and abuse reports there, never bans or unbans.
# Empty: off.
socket = ""                # "/run/vpsfort-console/console.sock" with vpsfort-web installed
group = "vpsfort-web"

[digest]
# One summary message per day at `at` (UTC): bans by cause, top offenders, alerts,
# exposure, cluster, feeds and certificate expiry.
# To Telegram, and (relay_notices) through the cluster to the XMPP admin, prefixed with "[tg]".
enabled = true
at = "07:05"
certs = []   # host:port, or host:port/xmpp for STARTTLS
cert_warn_days = 21
check_certs_every = "6h"
openssl = "/usr/bin/openssl"

[geo]
# Readable places ("Germany / Hetzner Online GmbH (AS24940)") in new-login alerts, bans, the TUI,
# `status` and the digest. Lookups happen in memory; only the databases are downloaded (weekly,
# ~12 MB, no account): DB-IP's free lite databases, CC BY 4.0 - credit "IP locations: DB-IP.com".
# A bought database works as it is: DB-IP's commercial CSVs (IP to Country first; a city-level
# one adds cities and coordinates), or any CSV whose header row names its columns (README).
# A new /16 of a provider the account already used is no longer a "new network".
enabled = true
country_url = "https://download.db-ip.com/free/dbip-country-lite-{month}.csv.gz"
asn_url = "https://download.db-ip.com/free/dbip-asn-lite-{month}.csv.gz"
# Public-domain alternative for the network half (registry handles instead of company names):
# asn_url = "https://iptoasn.com/data/ip2asn-combined.tsv.gz"
dir = "/var/lib/vpsfort/geo"
refresh = "7d"
# Ranges kept per database (16-24 bytes each): the lite databases and DB-IP's IP to Country
# fit; a city-level database needs this and the unit's memory limit raised together
# (a drop-in, `systemctl edit vpsfort`: README, "Memory"); the daemon warns at start if not.
#max_ranges = 2000000
# Networks the lite database places in the wrong country, pinned to the right one (an ISO
# code or a name). Labels, accounts' countries and counters use it; [geoblock] doesn't.
#places = { "198.51.100.0/24" = "GE" }


[geoblock]
# Drop whole countries or networks (ASNs), by the [geo] databases above: no other database and
# no download, only the firewall's sets. DB-IP's lite data misplaces some addresses: coarse.
# Never dropped: the allowlist, this host, the cluster peers. Backends nft, ipset, firewalld.
enabled = false
countries = []            # e.g. ["CN", "Russia"]: ISO codes or names
only_countries = []       # e.g. ["UA", "DE"]: every other country dropped (federation, CDNs, ...)
asns = []                 # e.g. [64500]
[cron]
# New or changed scheduled tasks are a classic sign of a break-in. Watched: /etc/crontab,
# /etc/cron.d/*, every user's crontab (what `crontab -l` shows), /etc/cron.{hourly,daily,
# weekly,monthly,yearly}, enabled systemd timers, and the scripts crontab lines run
# (e.g. /usr/local/bin/*.sh). Everything present during `learn` is accepted; after that
# each change is reported once ("integrity" admin topic) and becomes the new normal.
# Files installed by a package and unmodified (MD5 recorded by dpkg) are reported as warnings,
# anything else as high. See what is watched:  vpsfort -c ... integrity
enabled = true
interval = "1m"
learn = "1d"
# crontabs = ["/etc/crontab", "/etc/anacrontab", "/etc/cron.d/*", "/var/spool/cron/crontabs/*", "/var/spool/cron/*"]
# dirs = ["/etc/cron.hourly", "/etc/cron.daily", "/etc/cron.weekly", "/etc/cron.monthly", "/etc/cron.yearly", "/etc/systemd/system/timers.target.wants"]
scripts = true
# Other files whose changes are reported (`*` within one path component, in any component):
# SSH keys, sudoers, users, sshd settings, PAM, apt and dnf hooks, programs installed by hand,
# systemd units, preloaded libraries. Files of a pattern added later are learned
# silently; files of a removed pattern are forgotten.
# files = ["/etc/passwd", "/etc/shadow", "/etc/group", "/etc/sudoers", "/etc/sudoers.d/*",
#          "/etc/ssh/sshd_config", "/etc/ssh/sshd_config.d/*", "/root/.ssh/authorized_keys",
#          "/root/.ssh/authorized_keys2", "/home/*/.ssh/authorized_keys", "/home/*/.ssh/authorized_keys2",
#          "/etc/ssh/authorized_keys/*", "/etc/ld.so.preload", "/etc/ld.so.conf.d/*", "/etc/rc.local",
#          "/etc/profile.d/*", "/etc/environment", "/etc/bash.bashrc", "/root/.bashrc", "/root/.profile",
#          "/etc/pam.d/*", "/etc/apt/apt.conf.d/*", "/etc/dnf/plugins/post-transaction-actions.d/*",
#          "/etc/dnf/libdnf5-plugins/actions.d/*", "/etc/update-motd.d/*", "/etc/modules-load.d/*",
#          "/etc/modprobe.d/*", "/etc/udev/rules.d/*", "/etc/init.d/*", "/usr/local/bin/*", "/usr/local/sbin/*",
#          "/etc/systemd/system/*", "/etc/systemd/system/*.wants/*", "/etc/systemd/system/*.d/*.conf"]
dpkg_db = "/var/lib/dpkg"       # read directly (no dpkg process); "" on hosts without dpkg

[antivirus]
# Reports infected files found by scheduled ClamAV scans (critical), scans that did not
# finish (killed for memory, typically) and scans that stopped happening (stale_after).
# install.sh enables vpsfort-avscan.timer (daily 02:30, scan paths in
# /etc/default/vpsfort-avscan), which writes this log. Plain `clamscan --stdout` output
# appended to a file works too, e.g. log = "/var/log/av_scan_result.log".
enabled = false            # ClamAV is not installed here; apt install clamav clamav-freshclam, then true
log = "/var/log/vpsfort/avscan.log"
stale_after = "36h"
# Scans of the files the integrity watches report new or changed (cron jobs and their
# scripts, watched files, changed package files, set-uid programs, programs running from
# /tmp or deleted): "none", "clamav", "yara" or "both". Infected files are high alerts.
# clamscan and yara run outside vpsfort's memory limit (systemd-run, scan_memory).
scan_changed = "none"
# yara_rules = ["/etc/vpsfort/yara"]      # .yar/.yara files, directories of them, or one .yarc
# clamd_socket = "/run/clamav/clamd.ctl"   # while it exists, files go to clamd (Fedora: /run/clamd.scan/clamd.sock)
# clamd_config = ""                        # clamdscan's --config-file; empty: its default, or Fedora's /etc/clamd.d/scan.conf
# scan_memory = "2G"
# scan_timeout = "30m"
# scan_max_mb = 100

[journal]
journalctl = "/usr/bin/journalctl"
initial_lookback = "1h"
# journalctl --verify every so often ("0s" = never): damaged journal files, or with the
# verification key of Forward Secure Sealing (journalctl --setup-keys) entries changed after
# they were sealed. Separately, a high alert says when journald no longer has the position
# vpsfort read up to (journal files vacuumed or deleted while lines were unread).
verify_every = "0s"
# The verification key can seal entries too (every sealing key derives from it): on this
# server it only catches an intruder who doesn't look for it, and journalctl shows it to
# local users (ps) during each check unless /proc is mounted with hidepid=invisible.
# verify_key_file = "/etc/vpsfort/journal-verify.key"   # root only, 0600

[resources]
# Low disk space (warning below 10% free, high below 5%) and memory that stays short
# (under 10% available for 15 min, or tasks stalled on memory 10% of the time), checked
# every minute; each alert at most every 6 hours. /tmp is listed in case it is a tmpfs (in RAM).
enabled = true
interval = "60s"
disks = ["/", "/tmp"]
disk_warn_percent = 10
disk_high_percent = 5
mem_warn_percent = 10
mem_sustain = "15m"
psi_full_percent = 10

[patches]
# In the daily digest and the dashboard: pending security updates (apt-get -s, a simulation,
# run in a transient unit of its own with systemd-run, outside vpsfort's memory limit), a newer
# kernel than the running one, /run/reboot-required, programs still running replaced libraries.
enabled = true
interval = "6h"
apt = true

[verify]
# Weekly: package programs and libraries hashed against dpkg's checksums (like debsums; a
# replaced binary is how a rootkit hides), and the set-uid/set-gid programs, learned on the
# first pass. Reads at most max_rate_mb MB a second.
enabled = true
interval = "7d"
dirs = ["/usr/bin", "/usr/sbin", "/usr/lib", "/usr/libexec"]
exclude = ["/usr/lib/firmware"]
max_rate_mb = 20

[procwatch]
# Every minute from /proc: new outbound connections by program and remote port (learned for
# `learn`, then each new pair is reported once; shells and network tools talking out, and the
# ports miners and reverse shells use, are always high), and programs running from /tmp,
# /dev/shm, memory only, or a deleted file outside the package directories.
enabled = true
interval = "60s"
learn = "3d"
ignore_processes = []
ignore_ports = []

[ssh_audit]
# Hourly: sshd's effective settings (sshd -T, with -C for root and the gateway users, so Match
# blocks count) checked against good practice and this host's layout: a plain VPS, a hosting
# panel (cPanel/WHM, Plesk, ...), or a gateway like harden-vps.sh's (one key-only user forced
# into the su/sftp wrapper, su limited by pam_wheel, root-owned key files, no root login).
# New problems and changed settings are alerts; `vpsfort ssh-audit` shows all, with fixes.
enabled = true
interval = "1h"
profile = "auto"             # auto | standard | gateway
gateway_users = []           # empty: AllowUsers' users with a ForceCommand
su_group = "gw-su"
ignore = []                  # problem ids, e.g. ["x11-forwarding", "gateway-port"]
remind = "7d"                # high problems still open, again

# Log lines of your own (a service vpsfort has no parser for): a regex with the client
# address in group `ip` (and the account in `user`), over a systemd unit's journal lines or a
# log file. Try one with:  vpsfort -c ... test-pattern --pattern NAME FILE
# [[patterns]]
# name = "postfix_sasl"
# unit = "postfix@-.service"        # journal lines of this unit (or: identifier + uid; or: file)
# regex = 'warning: [^\[]*\[(?P<ip>[0-9A-Fa-f.:]+)\]: SASL \S+ authentication failed(: [^,]*, sasl_username=(?P<user>\S+))?'
# kind = "failure"                  # failure (per account), probe, or success (a login)
# weight = 25
# port = 587

[sysctl_audit]
# Hourly: the kernel's hardening sysctls (forwarding, ICMP redirects, source routing,
# rp_filter, SYN cookies, ASLR, kptr_restrict, dmesg_restrict, ptrace_scope, unprivileged BPF,
# protected links, suid_dumpable, ...) against good practice. The first reading tells
# everything; then a new or weakened one is an alert. `vpsfort sysctl-audit` shows all,
# with the line to set, and what the sysctl.d files set at the next boot (`--conf`: the
# lines that keep them all). Forwarding is a note where a VPN, container or bridge
# interface exists.
enabled = true
interval = "1h"
ignore = []                  # keys never reported, e.g. ["kernel.sysrq"]
remind = "7d"                # high problems still open, again
