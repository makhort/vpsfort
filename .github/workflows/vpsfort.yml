name: vpsfort

# Two kinds of push run this:
#   - a branch push that changes these paths: the tests, then the bundles and the .deb, .rpm and .apk
#     packages as workflow artifacts
#   - a push of this crate's version tag, e.g. vpsfort-v0.7.1 (the version must be
#     Cargo.toml's): the same, then the release job attaches them to the GitHub Release
#     of that tag. GitHub doesn't evaluate paths for tag pushes; other crates' tags don't match.
on:
  push:
    branches: ["**"]
    paths: ["vpsfort/**", ".github/workflows/vpsfort.yml"]
    tags: ["vpsfort-v[0-9]*"]
  pull_request:
    paths: ["vpsfort/**", ".github/workflows/vpsfort.yml"]

permissions:
  contents: read

# Actions are pinned to commits (the tag or branch in the comment): a tag can be moved, and
# the check job builds the bundles the release job attests and publishes.

jobs:
  # One bundle per architecture. x86_64 and aarch64 (arm64) run on runners of their own (GitHub's
  # arm64 runners are free in public repositories): every check, then the bundle's installer as
  # root. 32-bit ARM (armv7, hard-float) has no runner: it is cross-built on x86_64 and linted
  # for its target, and its binary started under qemu.
  check:
    name: check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
            native: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            native: true
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-24.04
            native: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30         # a hung test fails the job instead of running for 6 h
    env:
      TARGET: ${{ matrix.target }}   # what ci.sh and bundle.sh build
    defaults:
      run:
        working-directory: vpsfort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the tag against Cargo.toml
        if: github.ref_type == 'tag'
        run: ./scripts/bundle.sh --check-tag "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable   # pinned to a commit, it can't take it from the ref name
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: vpsfort
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        if: matrix.native
        with:
          tool: cargo-audit,cargo-deny@0.20.2,cargo-cyclonedx@0.5.9   # scripts/ci.sh; the SBOM below
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.1   # scripts/package.sh
      - if: matrix.native
        run: ./scripts/ci.sh
      # A CycloneDX SBOM of the crate and its dependencies: the same for every architecture,
      # so one, from the x86_64 job, attached to the release next to the bundles.
      - name: SBOM (CycloneDX)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          cargo cyclonedx --format json --target "$TARGET" --override-filename "vpsfort-$version.cdx"   # it appends .json
          mkdir -p target/sbom && mv "vpsfort-$version.cdx.json" target/sbom/
          cd target/sbom && sha256sum "vpsfort-$version.cdx.json" > "vpsfort-$version.cdx.json.sha256" && ls -l
      # armv7: the tests ran on x86_64 and aarch64; what differs on a 32-bit target is linted
      - name: Lint and build for the target (cross)
        if: ${{ !matrix.native }}
        run: |
          cargo clippy --all-targets --target "$TARGET" --quiet -- -D warnings
          cargo build --release --quiet --target "$TARGET"
      # Enforcement against the runner's kernel with the real nft, as root (every other
      # enforcement test uses a stand-in): tests/real_nft.rs, built as the runner's user and run
      # as root, so target/ stays the user's.
      - name: Enforce on the real kernel (tests/real_nft.rs, as root)
        if: matrix.native
        run: |
          sudo apt-get install -y -q nftables > /dev/null
          bin=$(cargo test --test real_nft --no-run --message-format=json 2> /dev/null |
                jq -r 'select(.executable != null and .target.name == "real_nft") | .executable')
          sudo VPSFORT_REAL_NFT=1 "$bin" --ignored --nocapture
      # The release bundle (scripts/bundle.sh): binary, deploy files, installer. Its installer is
      # tried as root on this throwaway runner, then the zip is published as it is (not zipped
      # again), with its .sha256 for the release job to check it against.
      - name: Bundle
        run: |
          out=$(./scripts/bundle.sh --target "$TARGET")
          zip=${out##*$'\n'}                      # its last line: the zip's path
          cd "${zip%/*}" && sha256sum "${zip##*/}" > "${zip##*/}.sha256"
      # The distribution packages (scripts/package.sh): the same binary and deploy files as a
      # .deb and an .rpm, each with its .sha256. Below, the .deb is installed on this runner
      # over the bundle's install (the package takes it over), upgraded and purged; the .rpm
      # in a Fedora container (no systemd there: the scriptlets must get by without it).
      - name: Package
        run: ./scripts/package.sh --target "$TARGET"
      - name: Install the bundle on the runner
        if: matrix.native
        run: |
          d=$(mktemp -d) && unzip -q target/bundle/*.zip -d "$d" && cd "$d"/vpsfort-*
          ./install.sh --check
          sudo ./install.sh --template vpsfort-standalone.toml   # new server: the template, nothing else
          test -f /etc/vpsfort/vpsfort.toml && test ! -e /usr/local/bin/vpsfort
          # a published template has [cluster] off and example peers (documentation addresses): on, as for a node joining others
          sudo sed -i '/^\[cluster\]/,/^\[/ s/^enabled = false/enabled = true/' /etc/vpsfort/vpsfort.toml
          sudo ./install.sh                                 # installs; starts in shadow mode
          systemctl is-active vpsfort
          sudo test -f /etc/vpsfort/cluster.key            # [cluster] on: a new key
          sudo ./install.sh                                 # an upgrade: config and key kept
          sudo test -f /etc/vpsfort/vpsfort.toml.new && test -x /usr/local/bin/vpsfort.prev
          systemctl is-active vpsfort
      # The installed daemon in enforce mode on the real kernel: an operator ban lands in its
      # nftables set with its time left, the table deleted is rebuilt within 30 s with the ban
      # still in it, and an unban takes it out.
      - name: Ban and heal with the running daemon (enforce mode)
        if: matrix.native
        run: |
          sudo sed -i 's/^mode = "shadow"/mode = "enforce"/' /etc/vpsfort/vpsfort.toml
          sudo systemctl restart vpsfort && sleep 5 && systemctl is-active vpsfort
          sudo vpsfort -c /etc/vpsfort/vpsfort.toml status | grep -q 'mode Enforce (nftables)'
          sudo vpsfort -c /etc/vpsfort/vpsfort.toml ban 198.51.100.7 --for 1h --note ci
          # nft lists a timed element as "<addr> expires <left>" or "<addr> timeout <t> expires <left>"
          sudo nft list set inet vpsfort ban4 | grep -Eq '198\.51\.100\.7 (timeout [^ ,]+ )?expires'
          sudo nft delete table inet vpsfort
          sleep 45                                                                     # the self-check runs every 30 s
          sudo nft list set inet vpsfort ban4 | grep -Eq '198\.51\.100\.7 (timeout [^ ,]+ )?expires'   # rebuilt, the ban still in it
          sudo journalctl -u vpsfort --no-pager | grep -q 'rebuilt it and restored'
          sudo vpsfort -c /etc/vpsfort/vpsfort.toml unban 198.51.100.7
          if sudo nft list set inet vpsfort ban4 | grep -q '198.51.100.7'; then exit 1; fi
      - name: Install the .deb on the runner
        if: matrix.native
        run: |
          deb=$(ls target/package/*.deb)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q "./$deb"     # over the bundle's install: taken over
          test -x /usr/bin/vpsfort && test ! -e /usr/local/bin/vpsfort && test ! -e /etc/systemd/system/vpsfort.service
          systemctl is-active vpsfort && systemctl is-enabled vpsfort            # it was running: restarted on the package's unit
          systemctl is-enabled vpsfort-abuse-report.timer
          sudo test -f /etc/vpsfort/vpsfort.toml.new && sudo test -f /etc/vpsfort/cluster.key
          sudo DEBIAN_FRONTEND=noninteractive dpkg -i "$deb"                            # an upgrade: config kept, restarted
          systemctl is-active vpsfort
          sudo apt-get purge -y -q vpsfort
          if systemctl is-active -q vpsfort; then exit 1; fi
          test ! -e /usr/bin/vpsfort && sudo test ! -e /etc/vpsfort
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q "./$deb"     # a new host: the template, nothing started
          sudo test -f /etc/vpsfort/vpsfort.toml
          if systemctl is-active -q vpsfort; then exit 1; fi
          sudo apt-get purge -y -q vpsfort
      - name: Install the .rpm in a Fedora container
        if: matrix.native
        run: |
          docker run --rm -v "$PWD/target/package:/pkg:ro" fedora:44 bash -ec '
            dnf install -y -q /pkg/*.rpm
            rpm -q vpsfort && vpsfort --version
            test -f /etc/vpsfort/vpsfort.toml                       # the template; no systemd in a container: nothing started
            rpm -V vpsfort
            rpm -U --replacepkgs /pkg/*.rpm                            # an upgrade: the config is kept
            test -f /etc/vpsfort/vpsfort.toml.new
            dnf remove -y -q vpsfort
            test ! -e /usr/bin/vpsfort && test -f /etc/vpsfort/vpsfort.toml'
      # RHEL and its rebuilds: older rpm, dnf and glibc than Fedora's. The package's scriptlets
      # and the static binary on AlmaLinux 9, the dnf template parsed (no systemd, no firewalld
      # in a container: nothing is started or enforced).
      - name: Install the .rpm in an AlmaLinux container
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm -v "$PWD/target/package:/pkg:ro" almalinux:9 bash -ec '
            dnf install -y -q /pkg/*.rpm
            rpm -q vpsfort && vpsfort --version
            test -f /etc/vpsfort/vpsfort.toml
            rpm -V vpsfort
            cp /usr/share/vpsfort/templates/vpsfort-standalone-dnf.toml /etc/vpsfort/vpsfort.toml
            vpsfort --config /etc/vpsfort/vpsfort.toml print-config > /dev/null   # the dnf template parses
            vpsfort --config /etc/vpsfort/vpsfort.toml sysctl-audit --all > /dev/null || true
            dnf remove -y -q vpsfort
            test ! -e /usr/bin/vpsfort'
      # Alpine: no systemd (OpenRC), no journal, busybox sh. The package's scripts are POSIX sh
      # and get by without openrc too (nothing is started in a container); the Alpine config
      # template (deploy/vpsfort-alpine.toml) reads /var/log/messages.
      - name: Install the .apk in an Alpine container
        if: matrix.native
        run: |
          docker run --rm -v "$PWD/target/package:/pkg:ro" alpine:3.21 sh -ec '
            apk add --quiet --no-cache --allow-untrusted /pkg/*.apk
            apk info -e vpsfort && vpsfort --version
            test -f /etc/vpsfort/vpsfort.toml && test -x /etc/init.d/vpsfort && test -x /usr/share/vpsfort/periodic/vpsfort-abuse-report
            grep -q "^syslog_file = " /etc/vpsfort/vpsfort.toml                    # the Alpine template
            vpsfort --config /etc/vpsfort/vpsfort.toml print-config > /dev/null
            apk info -L vpsfort | grep -q "^usr/bin/vpsfort$"
            apk del --quiet vpsfort
            test ! -e /usr/bin/vpsfort && test -f /etc/vpsfort/vpsfort.toml'
      - name: Check the packages (cross)
        if: ${{ !matrix.native }}
        run: |
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q rpm > /dev/null
          dpkg-deb -I target/package/*.deb | grep -q '^ Architecture: armhf'
          dpkg-deb -c target/package/*.deb | grep -q '/usr/bin/vpsfort$'
          rpm -qpi --nosignature target/package/*.rpm | grep -q '^Architecture: armv7hl'
          rpm -qpl --nosignature target/package/*.rpm | grep -q '^/usr/bin/vpsfort$'
          gzip -dc target/package/*.apk | tar -xOf - .PKGINFO | grep -q '^arch = armv7$'
          gzip -dc target/package/*.apk | tar -tf - | grep -q '^usr/bin/vpsfort$'
      - name: Start the binary under qemu
        if: ${{ !matrix.native }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static
          d=$(mktemp -d) && unzip -q target/bundle/*.zip -d "$d" && cd "$d"/vpsfort-*
          ./install.sh --check
          file files/vpsfort | grep -q 'ARM, EABI5'
          qemu-arm-static files/vpsfort --version
      # upload-artifact names each artifact after its file (archive: false: one file each)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: vpsfort/target/bundle/*.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.target == 'x86_64-unknown-linux-musl'
        with:
          path: vpsfort/target/sbom/*.cdx.json
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.target == 'x86_64-unknown-linux-musl'
        with:
          path: vpsfort/target/sbom/*.cdx.json.sha256
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: vpsfort/target/bundle/*.zip.sha256
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: vpsfort/target/package/*.deb
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: vpsfort/target/package/*.deb.sha256
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: vpsfort/target/package/*.rpm
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: vpsfort/target/package/*.rpm.sha256
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: vpsfort/target/package/*.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: vpsfort/target/package/*.apk.sha256
          archive: false
          if-no-files-found: error

  # Tag pushes only, once every architecture passed: the bundles and packages check built (and,
  # on x86_64 and aarch64, installed), their .sha256, and (in a public repository: GitHub offers attestations
  # for private ones only with Enterprise Cloud) one signed build provenance attestation for all
  # of them (as each bundle's .sigstore.json), attached to the GitHub Release of the tag.
  release:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write           # create the Release, upload its assets
      id-token: write           # the attestation: an OIDC token for the Sigstore certificate
      attestations: write
      artifact-metadata: write
      actions: write            # start the repository workflow (below)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true   # the bundles are themselves zips: keep them as they are
      - name: Check the bundles against their .sha256
        working-directory: dist
        run: |
          ls -l
          for f in "*-x86_64-linux-musl.zip" "*-aarch64-linux-musl.zip" "*-armv7-linux-musleabihf.zip" \
                   "*_amd64.deb" "*_arm64.deb" "*_armhf.deb" "*.x86_64.rpm" "*.aarch64.rpm" "*.armv7hl.rpm" \
                   "*.x86_64.apk" "*.aarch64.apk" "*.armv7.apk" "*.cdx.json"; do
              n=$(find . -maxdepth 1 -type f -name "$f" | wc -l)
              [ "$n" = 1 ] || { echo "$n files $f, not 1"; exit 1; }
          done
          [ "$(find . -type f | wc -l)" = 26 ] || { echo "unexpected files"; exit 1; }   # 12 bundles and packages, the SBOM, each with its .sha256
          sha256sum -c ./*.sha256                 # the very files check built
      - id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.cdx.json
      - name: Attach to the GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: |
          tag=$GITHUB_REF_NAME
          assets=(./*.zip ./*.deb ./*.rpm ./*.apk ./*.cdx.json ./*.sha256)
          if [ -n "$ATTESTATION" ]; then
              for z in ./*.zip ./*.deb ./*.rpm ./*.apk ./*.cdx.json; do        # one attestation covers every file
                  cp -- "$ATTESTATION" "$z.sigstore.json"
                  assets+=("$z.sigstore.json")
              done
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
              # a re-run: replace them, and drop what an earlier run left under another name (a
              # bundle is named after its commit: a moved tag builds new ones)
              gh release view "$tag" --json assets --jq '.assets[].name' | while read -r old; do
                  [ -e "./$old" ] || gh release delete-asset "$tag" "$old" --yes
              done
              gh release upload "$tag" "${assets[@]}" --clobber
          else
              # The notes: the version's section of the crate's CHANGELOG.md (--check-tag made sure it is
              # there; the mirror's squashed commits say nothing), then how to install and verify.
              version=${tag#*-v}
              # (this job has no checkout: the file as it is at the tag)
              gh api -H "Accept: application/vnd.github.raw+json" "repos/$GH_REPO/contents/vpsfort/CHANGELOG.md?ref=$tag" > "$RUNNER_TEMP/CHANGELOG.md"
              awk -v h="## $version" 'p && /^## / { exit } p { print } index($0, h) == 1 { p = 1 }' "$RUNNER_TEMP/CHANGELOG.md" > notes.md
              [ -s notes.md ] || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
              printf '\n---\n\n' >> notes.md
              printf '%s\n' \
                  "Install: $GITHUB_SERVER_URL/$GH_REPO/blob/$tag/vpsfort/README.md#install-from-a-release-bundle" "" \
                  "One bundle per architecture: \`x86_64-linux-musl\` (amd64), \`aarch64-linux-musl\` (arm64)," \
                  "\`armv7-linux-musleabihf\` (32-bit ARM, ARMv7 with hardware floating point). Static binaries: any distribution." "" \
                  "Or a package: \`apt install ./<name>_<version>-1_<amd64|arm64|armhf>.deb\` (Debian, Ubuntu)," \
                  "\`dnf install ./<name>-<version>-1.<x86_64|aarch64|armv7hl>.rpm\` (Fedora, RHEL)," \
                  "\`apk add --allow-untrusted ./<name>-<version>-r0.<x86_64|aarch64|armv7>.apk\` (Alpine, OpenRC): $GITHUB_SERVER_URL/$GH_REPO/blob/$tag/vpsfort/README.md#install-from-a-package" "" \
                  "Software bill of materials: \`<name>-<version>.cdx.json\` (CycloneDX: every crate in the binary, with its version and license)" "" \
                  "Verify: \`sha256sum -c <file>.sha256\`" \
                  "and \`gh attestation verify <file> --repo $GH_REPO --source-ref refs/tags/$tag\`" >> notes.md
              gh release create "$tag" "${assets[@]}" --verify-tag --title "$tag" --notes-file notes.md
          fi
      # A release made with a workflow's own token starts no other workflow (GitHub's rule against
      # loops), so `on: release` in repository.yml never fires for it: started here instead.
      - name: Rebuild the package repository
        if: ${{ !github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run repository.yml --ref "${{ github.event.repository.default_branch }}"
