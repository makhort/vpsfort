# cargo-deny (https://embarkstudios.github.io/cargo-deny/), for every crate here: the licenses
# the dependencies may carry, duplicate versions of one crate, and where crates may come from.
# Each crate's scripts/ci.sh runs `cargo deny --config ../deny.toml check licenses bans sources`;
# known vulnerabilities are cargo audit's step there, which also works offline.

[licenses]
# Permissive licenses, and MPL-2.0's file-level copyleft: the crates are MIT, and nothing
# that would reach into them may end up in the static binaries.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",   # webpki-root-certs: Mozilla's root store as data
]
confidence-threshold = 0.8
# One list for every crate: a license none of a crate's dependencies carry is no warning.
unused-allowed-license = "allow"

[bans]
# Two versions of one crate are reported, not refused: the crypto ecosystem moves in steps
# (rand 0.8 and 0.9, the RustCrypto 0.10 and 0.11 traits) and the bots carry both for a while.
multiple-versions = "warn"
# A dependency without a version bound would take whatever is newest. The crates here that use
# each other by path (publish = false: the bots and their library, the simulator) have none.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
